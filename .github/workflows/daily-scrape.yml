name: Daily News Scrape

on:
  schedule:
    # 하루 3회: 06:00, 12:00, 18:00 KST
    - cron: '0 21 * * *'   # 06:00 KST = 21:00 UTC (전날)
    - cron: '0 3 * * *'    # 12:00 KST = 03:00 UTC
    - cron: '0 9 * * *'    # 18:00 KST = 09:00 UTC
  workflow_dispatch:  # 수동 실행 가능
    inputs:
      profile:
        description: 'Profile name (leave empty for all)'
        required: false
        default: ''
      skip_email:
        description: 'Skip email sending'
        type: boolean
        default: false

jobs:
  health-check:
    runs-on: ubuntu-latest
    outputs:
      scrapers_healthy: ${{ steps.check.outputs.healthy }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt

      - name: Run health check
        id: check
        run: |
          cd backend
          if python health_check.py; then
            echo "healthy=true" >> $GITHUB_OUTPUT
          else
            echo "healthy=false" >> $GITHUB_OUTPUT
            echo "::warning::Some scrapers failed health check"
          fi

  scrape:
    runs-on: ubuntu-latest
    needs: health-check
    if: needs.health-check.outputs.scrapers_healthy == 'true' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt

      - name: Run scraper
        run: |
          cd backend
          if [ -n "${{ github.event.inputs.profile }}" ]; then
            python scrape_profile.py --profile "${{ github.event.inputs.profile }}"
          else
            python scrape_profile.py --all
          fi
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          BKEND_API_KEY: ${{ secrets.BKEND_API_KEY }}
          BKEND_SERVICE_URL: ${{ secrets.BKEND_SERVICE_URL }}
          BKEND_PROJECT_ID: ${{ secrets.BKEND_PROJECT_ID }}

      - name: Update frontend articles files
        run: |
          mkdir -p frontend/public/data

          # 프로필별 최신 파일들 복사 (articles_{profile_id}.json 형식)
          # 날짜가 포함되지 않은 파일만 복사 (최신 상태 유지용)
          for file in output/articles_*.json; do
            if [ -f "$file" ]; then
              filename=$(basename "$file")
              # 날짜 포함 파일 제외 (articles_{id}_{date}.json)
              if [[ ! "$filename" =~ ^articles_[a-f0-9]+_[0-9]{4}-[0-9]{2}-[0-9]{2}\.json$ ]]; then
                echo "Copying $file to frontend/public/data/$filename"
                cp "$file" "frontend/public/data/$filename"
              fi
            fi
          done

          # 프로필 목록 생성 (프론트엔드에서 사용 가능한 프로필 확인용)
          echo "[]" > frontend/public/data/profiles.json
          for file in frontend/public/data/articles_*.json; do
            if [ -f "$file" ]; then
              echo "Profile file found: $file"
            fi
          done

          ls -la frontend/public/data/

      - name: Commit and push articles update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add frontend/public/data/
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: Update profile articles from daily scrape

            🤖 Generated with GitHub Actions"
            git push
          fi

      - name: Send email briefings
        if: github.event.inputs.skip_email != 'true'
        run: |
          cd backend
          if [ -n "${{ github.event.inputs.profile }}" ]; then
            python send_briefing.py --to "$GMAIL_EMAIL" --profile "${{ github.event.inputs.profile }}"
          else
            python send_briefing.py --to "$GMAIL_EMAIL"
          fi
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GMAIL_EMAIL: ${{ secrets.GMAIL_EMAIL }}
          GMAIL_PASSWORD: ${{ secrets.GMAIL_PASSWORD }}
          BKEND_API_KEY: ${{ secrets.BKEND_API_KEY }}
          BKEND_SERVICE_URL: ${{ secrets.BKEND_SERVICE_URL }}
          BKEND_PROJECT_ID: ${{ secrets.BKEND_PROJECT_ID }}

  notify-failure:
    runs-on: ubuntu-latest
    needs: [health-check, scrape]
    if: failure()

    steps:
      - name: Log failure
        run: |
          echo "::error::Daily scrape failed. Check the logs for details."
          echo "Health check passed: ${{ needs.health-check.outputs.scrapers_healthy }}"
