name: Daily News Scrape

on:
  schedule:
    # 평일 오전 7시 (KST) = UTC 22:00 (전날)
    - cron: '0 22 * * 0-4'
  workflow_dispatch:  # 수동 실행 가능
    inputs:
      profile:
        description: 'Profile name (leave empty for all)'
        required: false
        default: ''
      skip_email:
        description: 'Skip email sending'
        type: boolean
        default: false

jobs:
  health-check:
    runs-on: ubuntu-latest
    outputs:
      scrapers_healthy: ${{ steps.check.outputs.healthy }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt

      - name: Run health check
        id: check
        run: |
          cd backend
          if python health_check.py; then
            echo "healthy=true" >> $GITHUB_OUTPUT
          else
            echo "healthy=false" >> $GITHUB_OUTPUT
            echo "::warning::Some scrapers failed health check"
          fi

  scrape:
    runs-on: ubuntu-latest
    needs: health-check
    if: needs.health-check.outputs.scrapers_healthy == 'true' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt

      - name: Run scraper
        run: |
          cd backend
          if [ -n "${{ github.event.inputs.profile }}" ]; then
            python scrape_profile.py --profile "${{ github.event.inputs.profile }}"
          else
            python scrape_profile.py --all
          fi
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          BKEND_API_KEY: ${{ secrets.BKEND_API_KEY }}
          BKEND_SERVICE_URL: ${{ secrets.BKEND_SERVICE_URL }}
          BKEND_PROJECT_ID: ${{ secrets.BKEND_PROJECT_ID }}

      - name: Update frontend articles.json
        run: |
          # 가장 최신 articles 파일을 frontend/public/data/에 복사
          LATEST_FILE=$(ls -t output/articles_*.json 2>/dev/null | head -1)
          if [ -n "$LATEST_FILE" ]; then
            echo "Copying $LATEST_FILE to frontend/public/data/articles.json"
            mkdir -p frontend/public/data
            cp "$LATEST_FILE" frontend/public/data/articles.json
          else
            echo "No articles file found in output/"
          fi

      - name: Commit and push articles update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add frontend/public/data/articles.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: Update articles.json from daily scrape

            🤖 Generated with GitHub Actions"
            git push
          fi

      - name: Send email briefings
        if: github.event.inputs.skip_email != 'true'
        run: |
          cd backend
          if [ -n "${{ github.event.inputs.profile }}" ]; then
            python send_briefing.py --to "$GMAIL_EMAIL" --profile "${{ github.event.inputs.profile }}"
          else
            python send_briefing.py --to "$GMAIL_EMAIL"
          fi
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GMAIL_EMAIL: ${{ secrets.GMAIL_EMAIL }}
          GMAIL_PASSWORD: ${{ secrets.GMAIL_PASSWORD }}
          BKEND_API_KEY: ${{ secrets.BKEND_API_KEY }}
          BKEND_SERVICE_URL: ${{ secrets.BKEND_SERVICE_URL }}
          BKEND_PROJECT_ID: ${{ secrets.BKEND_PROJECT_ID }}

  notify-failure:
    runs-on: ubuntu-latest
    needs: [health-check, scrape]
    if: failure()

    steps:
      - name: Log failure
        run: |
          echo "::error::Daily scrape failed. Check the logs for details."
          echo "Health check passed: ${{ needs.health-check.outputs.scrapers_healthy }}"
